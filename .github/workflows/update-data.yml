name: Mettre à jour les horaires

on:
  schedule:
    # heures UTC : 6h, 9h, 12h, 15h, 18h à Bruxelles (hiver) en semaine, + dimanche soir
    - cron: "0 5,8,11,14,17 * * 1-5"
    - cron: "0 18 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, scripts/build_data.py]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger les calendriers ECAM
        run: python scripts/build_data.py
      - name: Publier si quelque chose a changé
        run: |
          if git diff --quiet -- data/; then
            echo "Pas de changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/all.json
          git commit -m "Mise à jour des horaires"
          git push
